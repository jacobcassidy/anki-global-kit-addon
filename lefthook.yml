pre-commit:
  parallel: false
  commands:
    eslint:
      priority: 1
      glob:
        - "*.js"
        - "**/*.js"
      run: npx eslint {staged_files} --fix
      stage_fixed: true
    markdownlint:
      priority: 2
      glob:
        - "*.md"
        - "**/*.md"
      run: npx markdownlint-cli2 {staged_files} --fix
      stage_fixed: true
    prettier:
      priority: 3
      glob:
        - "*.{astro,elm,hbs,svelte,vue}"
        - "**/*.{astro,elm,hbs,svelte,vue}"
        - "*.css"
        - "**/*.css"
        - "*.html"
        - "**/*.html"
        - "*.js"
        - "**/*.js"
        - "*.{json,jsonc}"
        - "**/*.{json,jsonc}"
        - "*.md"
        - "**/*.md"
        - "*.{yaml,yml}"
        - "**/*.{yaml,yml}"
      run: npx prettier {staged_files} --write
      stage_fixed: true
    ruff-lint:
      priority: 4
      glob:
        - "*.py"
        - "**/*.py"
      run: uv run --locked ruff check --fix {staged_files}
      stage_fixed: true
    ruff-format:
      priority: 5
      glob:
        - "*.py"
        - "**/*.py"
      run: uv run --locked ruff format {staged_files}
      stage_fixed: true
    pyright:
      priority: 6
      glob:
        - "*.{py,pyi}"
        - "**/*.{py,pyi}"
        - "pyproject.toml"
        - "pyrightconfig.json"
        - "uv.lock"
        - "package.json"
        - "package-lock.json"
        - ".vscode/settings.json"
      run: npm run typecheck:py
