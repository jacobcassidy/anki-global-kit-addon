name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: npm ci
      - name: Lint scripts, styles, and documentation
        run: |
          npm run lint:scripts
          npm run lint:styles
          npm run lint:docs
      - name: Check formatting
        run: npm run check
      - name: Build generated assets
        run: npm run build:addon
      - name: Check asset paths
        run: npm run check:assets
      - name: Verify generated assets are current
        run: git diff --exit-code -- addon/web/assets addon/desktop/editor/assets addon/shared/assets/fonts/_meslolgl-nf-license.txt
      - name: Run JavaScript and Python tests
        run: npm test
