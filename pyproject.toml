[project]
name = "anki-global-kit"
version = "1.1.1"
description = "An Anki Desktop add-on for creating reusable card templates, formatting typed answers with Markdown, highlighting code, comparing answers, and customizing the Desktop editor."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
force-exclude = true
extend-exclude = ["addon/vendor/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
