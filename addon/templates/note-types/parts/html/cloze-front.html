<main class="global-kit-container card-front">
  <h1 class="topic">Topic</h1>

  <section class="question-container is-primary">
    <div class="question">{{cloze:Cloze Question}}</div>
    <div class="type-hint">{{Type Hint}}</div>
    <textarea class="question-input tappable is-cloze" data-compare="true" type="text"></textarea>
  </section>

  <section class="question-container is-bonus">
    <div class="question">{{Bonus Question}}</div>
    <div class="type-hint">{{Bonus Type Hint}}</div>
    <textarea class="question-input tappable" data-compare="{{Bonus Compare}}" type="text"></textarea>
  </section>
</main>
